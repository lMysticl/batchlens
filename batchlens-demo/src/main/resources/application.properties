server.address=127.0.0.1
server.port=8091
spring.application.name=batchlens-demo
spring.datasource.url=jdbc:h2:file:./data/batchlens;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
batchlens.enabled=true
batchlens.api-token=${BATCHLENS_API_TOKEN:local-demo-token-change-this-before-deployment}
batchlens.operations-enabled=true
batchlens.demo=true
server.error.include-message=never
logging.level.org.springframework.batch=INFO
